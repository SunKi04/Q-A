name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the latest public quiz
        shell: bash
        run: |
          set -euo pipefail
          origin="https://juanli-network-media-quiz.sunki0414.chatgpt.site"
          mkdir -p site/assets
          curl -fsSL "$origin/" -o site/index.html
          grep -oE '/assets/[A-Za-z0-9._-]+' site/index.html | sort -u > assets.txt
          while IFS= read -r asset
          do
            curl -fsSL "$origin$asset" -o "site/${asset#/}"
          done < assets.txt
          sed -i 's|/assets/|./assets/|g' site/index.html
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Mirrors Sites version 5
